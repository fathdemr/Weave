name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Weave makes hard today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Provider adapter
        - Glossary / terminology
        - Rendering (replace / dual view / new mode)
        - Options UI
        - Performance or caching
        - Other
    validations:
      required: true
