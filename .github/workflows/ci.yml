name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Type check, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check, lint, format
        run: npm run check

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: weave-chrome-mv3
          path: dist/chrome-mv3
          retention-days: 7
